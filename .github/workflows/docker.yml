name: build-docker

# 触发：打 tag（v开头）时自动构建发版；也可在 Actions 页面手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # arm64 需要 QEMU 模拟
      - uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}     # 例：registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送多架构镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.ACR_IMAGE }}:latest
            ${{ secrets.ACR_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ↓ 顺手导出一份「离线镜像包」，供 Gitee Releases 托底（用户不联网也能装）
      - name: 构建 amd64 镜像用于导出
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: fnhk:offline

      - name: 导出离线包
        run: |
          docker save fnhk:offline | gzip -9 > fnhk-docker-offline-amd64.tar.gz
          ls -lh fnhk-docker-offline-amd64.tar.gz
          # 若超过 100MB（Gitee 单文件限制），自动分卷，例如 .part-aa/.part-ab
          SIZE=$(stat -c%s fnhk-docker-offline-amd64.tar.gz)
          if [ "$SIZE" -gt 104857600 ]; then
            split -b 95m -d -a 2 fnhk-docker-offline-amd64.tar.gz fnhk-docker-offline-amd64.tar.gz.part-
            rm -f fnhk-docker-offline-amd64.tar.gz
            ls -lh fnhk-docker-offline-amd64.tar.gz.part-*
          fi

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fnhk-docker-offline
          path: fnhk-docker-offline-amd64.tar.gz*
          if-no-files-found: error
