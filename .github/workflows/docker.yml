name: build-docker

# 触发：打 tag（v开头）自动发版；也可在 Actions 页面手动触发（手动触发不需要 镜像仓库密钥，会只构建+产出离线包）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # arm64 需要 QEMU 模拟
      - uses: docker/setup-buildx-action@v3

      # —— 以下两步只在配好阿里云 镜像仓库密钥后才会执行 ——
      - name: 登录镜像仓库
        if: env.REGISTRY_HOST != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: 构建并推送多架构镜像（amd64 + arm64）
        if: env.REGISTRY_HOST != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/fnhk:latest
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/fnhk:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # —— 离线镜像包：任何情况下都产出（供 Gitee Releases 托底）——
      - name: 构建 amd64 镜像（用于导出离线包）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: fnhk:offline

      - name: 导出离线包
        run: |
          docker save fnhk:offline | gzip -9 > fnhk-docker-offline-amd64.tar.gz
          ls -lh fnhk-docker-offline-amd64.tar.gz
          SIZE=$(stat -c%s fnhk-docker-offline-amd64.tar.gz)
          echo "离线包大小: $((SIZE/1024/1024)) MB"
          # 超过 100MB（Gitee 单文件限制）则自动分卷
          if [ "$SIZE" -gt 104857600 ]; then
            split -b 95m -d -a 2 fnhk-docker-offline-amd64.tar.gz fnhk-docker-offline-amd64.tar.gz.part-
            rm -f fnhk-docker-offline-amd64.tar.gz
            ls -lh fnhk-docker-offline-amd64.tar.gz.part-*
          fi

      - name: 上传离线包为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fnhk-docker-offline
          path: fnhk-docker-offline-amd64.tar.gz*
          if-no-files-found: error
