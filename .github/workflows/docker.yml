name: build-docker

# 说明：
#  默认（推荐）：只在本机构建 amd64 镜像 → 导出离线包 → 上传为构建产物。
#    · 快（约 3~5 分钟），GitHub 机房在海外，不承担跨境推镜像的慢速环节。
#    · 发布时由国内机器用 `docker/push.sh`（crane，无需 docker 守护进程）推到镜像仓库。
#  可选：勾选 push_registry=true 时，CI 会构建多架构（amd64+arm64）并直接推送到镜像仓库。
#    · 需要配置 Secrets：REGISTRY_HOST / REGISTRY_NAMESPACE / REGISTRY_USERNAME / REGISTRY_PASSWORD
#    · 跨境推送较慢（可能 30 分钟以上），仅在有需要时使用。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_registry:
        description: '同时推送镜像到仓库（多架构，较慢）'
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      PUSH_REGISTRY: ${{ github.event_name == 'workflow_dispatch' && inputs.push_registry || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU
        if: env.PUSH_REGISTRY == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        if: env.PUSH_REGISTRY == 'true' && env.REGISTRY_HOST != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: 构建并推送多架构镜像（amd64 + arm64）
        if: env.PUSH_REGISTRY == 'true' && env.REGISTRY_HOST != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/fnhk:latest
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_NAMESPACE }}/fnhk:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建 amd64 镜像（用于导出离线包）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fnhk:offline
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 导出离线包（超 100MB 自动分卷）
        run: |
          set -euo pipefail
          docker save fnhk:offline | gzip -9 > fnhk-docker-offline-amd64.tar.gz
          ls -lh fnhk-docker-offline-amd64.tar.gz
          SZ=$(stat -c%s fnhk-docker-offline-amd64.tar.gz)
          echo "离线包大小: $((SZ/1048576)) MB"
          if [ "$SZ" -gt 104857600 ]; then
            echo "超过 100MB，按 95MB 分卷（Gitee 单文件上限）："
            split -b 95m -d -a 2 fnhk-docker-offline-amd64.tar.gz fnhk-docker-offline-amd64.tar.gz.part-
            rm -f fnhk-docker-offline-amd64.tar.gz
            ls -lh fnhk-docker-offline-amd64.tar.gz.part-*
            echo "合并命令：cat fnhk-docker-offline-amd64.tar.gz.part-* > fnhk-docker-offline-amd64.tar.gz"
          fi

      - name: 上传离线包为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fnhk-docker-offline
          path: fnhk-docker-offline-amd64.tar.gz*
          if-no-files-found: error
          retention-days: 30
