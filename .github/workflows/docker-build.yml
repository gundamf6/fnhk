name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 QEMU 模拟器（用于交叉编译 ARM64）
      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      # 设置 Docker Buildx 环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 构建并推送 amd64 与 arm64 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 替换你的 Docker Hub 用户名和镜像名称
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/your-repo-name:latest
            ${{ secrets.DOCKER_USERNAME }}/your-repo-name:${{ github.sha }}
